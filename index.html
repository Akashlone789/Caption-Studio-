<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caption Generator App</title>
  <!-- Tailwind CSS & React CDN (कोणत्याही इन्स्टॉलेशनची गरज नाही) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    function App() {
      const [language, setLanguage] = React.useState('mr');
      const [topic, setTopic] = React.useState('');
      const [caption, setCaption] = React.useState('');
      const [imageUrl, setImageUrl] = React.useState('');
      const [loading, setLoading] = React.useState(false);

      const presets = [
        { label: 'दिवाळी सण', topic: { mr: 'दिवाळी उत्सव आणि दिव्यांची रोषणाई', hi: 'दिवाली का पावन त्योहार', en: 'Diwali celebration of lights' }, img: 'https://images.unsplash.com/photo-1605371924599-2d0365da1ae0?auto=format&fit=crop&w=800&q=80' },
        { label: 'चहा आणि पाऊस', topic: { mr: 'पावसाळा आणि गरमागरम आलं चहा', hi: 'रिमझिम बारिश और अदरक वाली चाय', en: 'Monsoon rain with hot cutting chai' }, img: 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=800&q=80' },
        { label: 'सह्याद्री ट्रेक', topic: { mr: 'सह्याद्रीची हिरवीगार निसर्ग भ्रमंती', hi: 'पहाड़ों की खूबसूरत वादियों में ट्रेक', en: 'Sahyadri mountain trek with morning fog' }, img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80' }
      ];

      const handleGenerate = () => {
        if (!topic.trim()) return;
        setLoading(true);
        setTimeout(() => {
          let text = '';
          let img = 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80';
          if (language === 'mr') {
            text = `"${topic}" या विषयावर खास कॅप्शन:\n\nनिसर्गाच्या सानिध्यात रममाण होण्याचा आणि मनाला नवी ऊर्जा देणारा सुंदर क्षण! ✨🌿\n\n#मराठी #${topic.replace(/\s+/g, '')} #महाराष्ट्र #जीवन`;
          } else if (language === 'hi') {
            text = `"${topic}" के लिए खूबसूरत कैप्शन:\n\nप्रकृति की गोद में सुकून और खुशियों का अनमोल अहसास! 🌸✨\n\n#हिंदी #${topic.replace(/\s+/g, '')} #जिंदगी`;
          } else {
            text = `Captivating visual story for "${topic}":\n\nEmbracing serene moments and finding magic in everyday life! 💫🍃\n\n#Inspiration #${topic.replace(/\s+/g, '')} #LifeMoments`;
          }
          setCaption(text);
          setImageUrl(img);
          setLoading(false);
        }, 700);
      };

      const copyCaption = () => {
        navigator.clipboard.writeText(caption);
        alert('कॅप्शन कॉपी झाले आहे!');
      };

      return (
        <div className="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
          <h1 className="text-2xl font-bold text-center mb-1 text-indigo-400">✨ व्हिज्युअल कॅप्शन स्टुडिओ</h1>
          <p className="text-xs text-center text-slate-400 mb-6">सोशल मीडियासाठी आकर्षक कॅप्शन आणि इमेज</p>

          {/* भाषा निवडा */}
          <div className="mb-4">
            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">भाषा निवडा (Language)</label>
            <select 
              value={language} 
              onChange={(e) => setLanguage(e.target.value)}
              className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="mr">मराठी (Marathi)</option>
              <option value="hi">हिंदी (Hindi)</option>
              <option value="en">English (इंग्रजी)</option>
            </select>
          </div>

          {/* त्वरित विषय (Presets) */}
          <div className="mb-4">
            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">तयार विषय निवडा</label>
            <div className="flex flex-wrap gap-2">
              {presets.map((p, idx) => (
                <button
                  key={idx}
                  onClick={() => {
                    setTopic(p.topic[language] || p.topic.en);
                    setImageUrl(p.img);
                  }}
                  className="text-xs bg-slate-700 hover:bg-indigo-600/30 text-indigo-200 border border-indigo-500/20 px-3 py-1.5 rounded-full transition"
                >
                  {p.label}
                </button>
              ))}
            </div>
          </div>

          {/* विषय इनपुट */}
          <div className="mb-5">
            <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">विषय (Topic)</label>
            <input 
              type="text" 
              value={topic}
              onChange={(e) => setTopic(e.target.value)}
              placeholder="उदा. सह्याद्री ट्रेक, कॉफी, पाऊस..."
              className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          {/* जनरेट बटण */}
          <button 
            onClick={handleGenerate}
            disabled={loading}
            className="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 disabled:opacity-50 mb-6"
          >
            {loading ? 'कॅप्शन तयार होत आहे...' : '🚀 कॅप्शन आणि इमेज बनवा'}
          </button>

          {/* तयार झालेले कॅप्शन */}
          {caption && (
            <div className="mb-6 bg-slate-900/80 rounded-2xl p-4 border border-slate-700">
              <div className="flex justify-between items-center mb-2">
                <span className="text-xs font-semibold text-indigo-400 uppercase">तयार झालेले कॅप्शन</span>
                <button 
                  onClick={copyCaption}
                  className="text-xs bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 px-3 py-1 rounded-lg transition"
                >
                  📋 कॉपी करा
                </button>
              </div>
              <textarea 
                value={caption}
                onChange={(e) => setCaption(e.target.value)}
                rows={4}
                className="w-full bg-transparent text-sm text-slate-200 resize-none focus:outline-none"
              />
            </div>
          )}

          {/* इमेज डिस्प्ले */}
          {imageUrl && (
            <div className="rounded-2xl overflow-hidden border border-slate-700 shadow-md">
              <img src={imageUrl} alt="Generated Visual" className="w-full h-52 object-cover" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
